[pytest]

testpaths = tests

addopts =
    -v
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --tracing=retain-on-failure
    --screenshot=only-on-failure

markers =
    smoke: quick sanity checks
    ui: functional UI tests (Page Object Model)
    api: functional and security API tests
    db: direct database verification tests
    integration: cross-layer tests spanning UI, API and DB
    auth: authentication / session security tests
    sqli: SQL injection tests
    xss: cross-site scripting tests
    access_control: broken access control / IDOR tests
    business_logic: business logic abuse tests
    file_upload: file upload security tests
    validation: input validation tests